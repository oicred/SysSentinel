substitutions:
  _REGION: us-central1
  _REPOSITORY: hackathon
  _SERVICE_ACCOUNT: syssentinel-runtime

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/syssentinel:$BUILD_ID
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/syssentinel:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - syssentinel
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/syssentinel:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=${_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com
      - --memory=512Mi
      - --cpu=1
      - --concurrency=2
      - --max-instances=1
      - --timeout=60s
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:1,DEMO_API_KEY=demo-api-key:1

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/syssentinel:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
